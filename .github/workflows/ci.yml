# CI: light static checks + secret scan (image build lives in build.yml).
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all scripts
        run: |
          set -eu
          shopt -s nullglob
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: YAML parse recipe
        run: python3 -c "import yaml,sys; yaml.safe_load(open('recipe.yml')); print('recipe.yml OK')"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eu
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --source . --redact
